# CalcBridge 静态站点 Nginx 示例。
# 将 apps/web/dist 的内容部署到 /usr/share/nginx/html，然后 include 本配置。
# TLS 应在反向代理/负载均衡层终止；本示例不写 HSTS，避免开发或内网环境被锁定。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # 安全响应头（always 确保错误响应也携带）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    # SPA 路由回退；静态资源缺失时不要回退成 HTML。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
    }
}
