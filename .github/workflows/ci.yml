name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 锁文件可复现安装；禁止 npm install 在 CI 中漂移依赖树。
      - name: Install (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 分层依赖与代码规范同为阻断项，防止架构约束只停留在文档里
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # 单测 + 算例回归 + 覆盖率门禁（core/求解器 lines≥80%、branches≥70%）
      - name: Unit tests, regression & coverage
        run: npm run coverage

      - name: Production build
        run: npm run build:web

      # 首屏 JS/CSS 体积门禁，防止懒加载退化或误引入大依赖
      - name: Bundle size gate
        run: npm run size

      # 外部基准覆盖率门禁：17 个数值模块均需 ≥6 用例且 ≥2 份可追溯依据
      - name: Benchmark coverage gate
        run: npm run benchmark:coverage:strict

      # 执行已录入的外部基准用例；任何一项超出容差即阻断
      - name: Benchmark execution
        run: npm run benchmark:run

      # 生产依赖必须无高危；当前为 0 漏洞。
      - name: Audit production dependencies
        run: npm run audit:prod

      # 工具链已升级到 vitest 5 / vite 8；完整审计也作为强制门禁。
      - name: Audit all dependencies
        run: npm run audit:all

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      # 浏览器体积较大，按 lockfile 缓存；Playwright 升级后自动失效。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build:web

      # 关键链路冒烟：首页 → 面板、命令面板、深链与设计文件导出
      - name: E2E smoke
        run: npm run test:e2e
